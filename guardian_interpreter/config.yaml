# Guardian Interpreter Configuration
# This is the main configuration file for Guardian Node family cybersecurity system

# System Information
system:
  name: "Guardian Node"
  version: "1.0.0"
  owner: "Family"
  description: "Local AI-powered family cybersecurity assistant"

# LLM (Language Model) Configuration
llm:
  # Docker-based LLM runner (for containerized deployments)
  docker_runner:
    enabled: false
    api_url: "http://localhost:8000"
    model_name: "phi-3-mini"
  
  # Local LLM models configuration
  # TODO: Download models and place them in the models/ directory
  # Models can be obtained from HuggingFace or similar sources
  models:
    default:
      path: "models/Phi-3-mini-4k-instruct-q4.gguf"
      context_length: 4096
      threads: 4
      age_groups: ["adult", "teen", "child"]
      contexts: ["general", "security", "education"]
    
    security_expert:
      path: "models/mistral-7b-security-q4.gguf"
      context_length: 8192
      threads: 4
      age_groups: ["adult"]
      contexts: ["security", "threat_analysis"]
    
    family_assistant:
      path: "models/Phi-3-mini-4k-instruct-q4.gguf"
      context_length: 4096
      threads: 4
      age_groups: ["child", "teen"]
      contexts: ["education", "child_safety", "device_guidance"]

# Network Configuration
network:
  # Privacy-first: Disable online access by default
  ALLOW_ONLINE: false
  
  # Allowed domains (if ALLOW_ONLINE is true)
  allowed_domains:
    - "localhost"
    - "127.0.0.1"
  
  # Block external calls (privacy protection)
  BLOCK_EXTERNAL_CALLS: true
  
  # Audit all network requests
  AUDIT_NETWORK_CALLS: true

# Logging Configuration
logging:
  level: "INFO"
  main_log: "logs/guardian.log"
  blocked_calls_log: "logs/blocked_calls.log"
  audit_log: "logs/audit.log"
  family_queries_log: "logs/family_queries.log"
  
  # Log rotation
  rotation:
    enabled: true
    max_bytes: 10485760  # 10 MB
    backup_count: 5

# Family Assistant Configuration
family_assistant:
  enabled: true
  
  # Family LLM settings
  family_llm:
    default_safety_level: "standard"  # strict, moderate, standard
    filter_inappropriate_content: true
    age_verification_required: false
  
  # GUI settings
  gui_enabled: true
  gui:
    theme: "family_friendly"  # family_friendly, professional, high_contrast
    font_size: "medium"  # small, medium, large
    show_confidence_scores: true
    enable_visual_feedback: true
  
  # Voice interface settings
  voice_interface:
    enabled: false
    wake_word: "guardian"
    session_timeout: 60  # seconds
    offline_mode: true
    
  # Parental controls
  parental_controls:
    enabled: true
    require_parent_approval: false
    content_filtering: true
    time_restrictions:
      enabled: false
      daily_limit_minutes: 120

# Skills Configuration
skills:
  # Available security skills
  enabled_skills:
    - "threat_analysis"
    - "password_check"
    - "device_scan"
    - "parental_control_check"
    - "phishing_education"
    - "network_security_audit"
  
  # Skill execution settings
  execution:
    timeout: 30  # seconds
    max_concurrent: 3
    require_confirmation: false

# Security Settings
security:
  # Privacy protection
  privacy_mode: true
  offline_first: true
  
  # Data handling
  store_conversations: false
  anonymize_logs: true
  
  # Audit settings
  comprehensive_audit: true
  audit_retention_days: 90

# Device Detection
device_detection:
  enabled: false  # Requires additional dependencies (scapy, netifaces)
  scan_interval: 300  # seconds
  auto_assess_security: false

# Performance Settings
performance:
  cache_enabled: true
  cache_size_mb: 100
  preload_models: false

# Feature Flags
features:
  mcp_server: true
  grok_integration: false
  voice_commands: false
  device_monitoring: false
  network_scanning: false
